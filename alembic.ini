# Alembic config. The DB connection string is injected at runtime by
# alembic/env.py from app.config.Settings (DATABASE_URL in .env),
# NOT hardcoded here, to keep credentials out of the repo.
# NOTE: keep this file ASCII-only -- Alembic reads it with the locale
# encoding (GBK on zh-CN Windows), non-ASCII bytes break parsing.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Revision filename format: <revision>_<slug>.py (%% escapes ConfigParser interpolation)
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is injected by env.py at runtime; placeholder only (empty not allowed)
sqlalchemy.url = postgresql+asyncpg://

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
