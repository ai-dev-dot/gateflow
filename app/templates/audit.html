{% extends "base.html" %}
{% block title %}LLM 调用日志 — GateFlow{% endblock %}
{% block nav_audit %}active{% endblock %}
{% block header_title %}LLM 调用日志{% endblock %}

{% block content %}
<div class="space-y-4">
  <!-- Filters -->
  <div class="gf-card">
    <div class="gf-card-body">
      <form id="filter-form" class="flex flex-wrap items-end gap-3">
        <div>
          <label class="block text-xs mb-1" style="color: var(--text-muted);">模型</label>
          <select id="f-model">
            <option value="">全部</option>
          </select>
        </div>
        <div>
          <label class="block text-xs mb-1" style="color: var(--text-muted);">开始日期</label>
          <input type="date" id="f-from">
        </div>
        <div>
          <label class="block text-xs mb-1" style="color: var(--text-muted);">结束日期</label>
          <input type="date" id="f-to">
        </div>
        <button type="submit" class="btn-primary">筛选</button>
        <button type="button" onclick="resetFilters()" class="btn-ghost">重置</button>
      </form>
    </div>
  </div>

  <!-- Table -->
  <div class="gf-card overflow-x-auto">
    <table class="gf-table">
      <thead>
        <tr>
          <th>时间</th>
          <th>用户</th>
          <th>模型</th>
          <th>状态</th>
          <th class="text-right">请求 Tokens</th>
          <th class="text-right">响应 Tokens</th>
          <th class="text-right">延迟</th>
          <th>HTTP</th>
        </tr>
      </thead>
      <tbody id="audit-body">
        <tr><td colspan="8" class="text-center py-8" style="color: var(--text-muted);">加载中...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div id="pagination" class="flex justify-between items-center text-sm" style="color: var(--text-muted);">
    <span id="page-info"></span>
    <div class="flex gap-2">
      <button id="btn-prev" onclick="changePage(-1)" class="btn-ghost" disabled>上一页</button>
      <button id="btn-next" onclick="changePage(1)" class="btn-ghost" disabled>下一页</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
const pageSize = 20;

async function loadLogs() {
  const model = document.getElementById('f-model').value;
  const from = document.getElementById('f-from').value;
  const to = document.getElementById('f-to').value;

  const params = new URLSearchParams({ page: currentPage, page_size: pageSize });
  if (model) params.set('model', model);
  if (from) params.set('from', from);
  if (to) params.set('to', to);

  try {
    const res = await fetch('/api/audit/logs?' + params, { credentials: 'same-origin' });
    const data = await res.json();
    const logs = data.items || data;
    const total = data.total || logs.length;

    const tbody = document.getElementById('audit-body');
    if (!logs.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8" style="color: var(--text-muted);">暂无记录</td></tr>';
    } else {
      tbody.innerHTML = logs.map(l => {
        const isSuccess = l.status === 'success';
        const httpOk = l.http_status && l.http_status < 400;
        // P1-8: failed rows carry diagnostics in error_message - surface it
        // as a hover tooltip on the status tag (escaped, DB-sourced).
        const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
        const errTitle = !isSuccess && l.error_message ? ` title="${esc(l.error_message)}" style="cursor: help;"` : '';
        return `<tr>
          <td>${formatDateTime(l.timestamp || l.created_at)}</td>
          <td>${l.username || l.user_id || '—'}</td>
          <td>${l.model_alias || l.model || '—'}</td>
          <td>${isSuccess ? '<span class="gf-tag gf-tag-green">success</span>' : `<span class="gf-tag gf-tag-red"${errTitle}>${l.status || 'error'}</span>`}</td>
          <td class="text-right">${l.request_tokens ?? '—'}</td>
          <td class="text-right">${l.response_tokens ?? '—'}</td>
          <td class="text-right">${l.latency_ms != null ? l.latency_ms + ' ms' : '—'}</td>
          <td>${l.http_status ? (httpOk ? '<span class="gf-tag gf-tag-green">' + l.http_status + '</span>' : '<span class="gf-tag gf-tag-red">' + l.http_status + '</span>') : '—'}</td>
        </tr>`;
      }).join('');
    }

    // Pagination
    document.getElementById('page-info').textContent = `第 ${currentPage} 页，共 ${Math.ceil(total / pageSize)} 页 (${total} 条)`;
    document.getElementById('btn-prev').disabled = currentPage <= 1;
    document.getElementById('btn-next').disabled = currentPage * pageSize >= total;
  } catch (e) {
    console.error('loadLogs error:', e);
  }
}

function changePage(delta) {
  currentPage += delta;
  loadLogs();
}

function resetFilters() {
  document.getElementById('f-model').value = '';
  document.getElementById('f-from').value = '';
  document.getElementById('f-to').value = '';
  currentPage = 1;
  loadLogs();
}

document.getElementById('filter-form').addEventListener('submit', (e) => {
  e.preventDefault();
  currentPage = 1;
  loadLogs();
});

async function loadModels() {
  try {
    const res = await fetch('/api/gateway/models', { credentials: 'same-origin' });
    const models = await res.json();
    const select = document.getElementById('f-model');
    models.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.alias || m.target_model;
      opt.textContent = m.alias || m.target_model;
      select.appendChild(opt);
    });
  } catch {}
}

loadModels();
loadLogs();
</script>
{% endblock %}
