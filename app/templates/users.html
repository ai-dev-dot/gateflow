{% extends "base.html" %}
{% block title %}人员管理 — GateFlow{% endblock %}
{% block nav_users %}active{% endblock %}
{% block header_title %}人员管理{% endblock %}

{% block content %}
<div class="space-y-4">
  <!-- Tabs -->
  <div class="flex rounded-lg overflow-hidden" style="border: 1px solid var(--border); width: fit-content;">
    <button onclick="switchTab('users')" id="tab-users" class="dim-tab active px-4 py-1.5 text-xs font-medium transition-colors">用户管理</button>
    <button onclick="switchTab('departments')" id="tab-departments" class="dim-tab px-4 py-1.5 text-xs font-medium transition-colors">部门管理</button>
  </div>

  <!-- Users Tab -->
  <div id="panel-users">
    <div class="flex justify-end mb-3">
      <button onclick="showUserModal()" class="btn-primary">+ 创建用户</button>
    </div>
    <div class="gf-card overflow-x-auto">
      <table class="gf-table">
        <thead>
          <tr>
            <th>用户名</th>
            <th>邮箱</th>
            <th>角色</th>
            <th>部门</th>
            <th>状态</th>
            <th class="text-right">操作</th>
          </tr>
        </thead>
        <tbody id="users-body"><tr><td colspan="6" class="text-center py-8" style="color: var(--text-muted);">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Departments Tab -->
  <div id="panel-departments" class="hidden">
    <div class="flex justify-end mb-3">
      <button onclick="showDeptModal()" class="btn-primary">+ 创建部门</button>
    </div>
    <div class="gf-card overflow-x-auto">
      <table class="gf-table">
        <thead>
          <tr>
            <th>部门名称</th>
            <th>上级部门</th>
            <th class="text-right">操作</th>
          </tr>
        </thead>
        <tbody id="depts-body"><tr><td colspan="3" class="text-center py-8" style="color: var(--text-muted);">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- User Modal -->
<dialog id="user-modal">
  <div class="gf-card-header flex justify-between items-center">
    <h3 id="user-modal-title" class="text-sm font-semibold">创建用户</h3>
    <button onclick="document.getElementById('user-modal').close()" style="color: var(--text-muted); font-size: 18px; background: none; border: none; cursor: pointer;">&times;</button>
  </div>
  <form id="user-form" class="p-4 space-y-3">
    <input type="hidden" id="uf-id">
    <div><label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);">用户名</label><input type="text" id="uf-username" data-field="username" required></div>
    <div><label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);">密码 <span id="uf-pw-hint" style="color: var(--text-muted); display: none;">(留空则不修改)</span></label><input type="password" id="uf-password" data-field="password"></div>
    <div><label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);">邮箱</label><input type="email" id="uf-email" data-field="email" required></div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);">角色</label><select id="uf-role" data-field="role"><option value="user">user</option><option value="admin">admin</option></select></div>
      <div><label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);">部门</label><select id="uf-dept" data-field="department_id"><option value="">无</option></select></div>
    </div>
    <div class="flex items-center gap-2"><input type="checkbox" id="uf-active" checked><label for="uf-active" class="text-sm">启用</label></div>
    <div class="flex justify-end gap-2 pt-2">
      <button type="button" onclick="document.getElementById('user-modal').close()" class="btn-ghost">取消</button>
      <button type="submit" class="btn-primary">保存</button>
    </div>
  </form>
</dialog>

<!-- Dept Modal -->
<dialog id="dept-modal">
  <div class="gf-card-header flex justify-between items-center">
    <h3 id="dept-modal-title" class="text-sm font-semibold">创建部门</h3>
    <button onclick="document.getElementById('dept-modal').close()" style="color: var(--text-muted); font-size: 18px; background: none; border: none; cursor: pointer;">&times;</button>
  </div>
  <form id="dept-form" class="p-4 space-y-3">
    <input type="hidden" id="df-id">
    <div><label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);">部门名称</label><input type="text" id="df-name" data-field="name" required></div>
    <div><label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);">上级部门</label><select id="df-parent" data-field="parent_id"><option value="">无</option></select></div>
    <div class="flex justify-end gap-2 pt-2">
      <button type="button" onclick="document.getElementById('dept-modal').close()" class="btn-ghost">取消</button>
      <button type="submit" class="btn-primary">保存</button>
    </div>
  </form>
</dialog>
{% endblock %}

{% block scripts %}
<script>
let userEditingId = null;
let deptEditingId = null;
let departments = [];
let roles = [];

function switchTab(tab) {
  document.getElementById('panel-users').classList.toggle('hidden', tab !== 'users');
  document.getElementById('panel-departments').classList.toggle('hidden', tab !== 'departments');
  document.querySelectorAll('.dim-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
}

async function loadAll() {
  await Promise.all([loadDepartments(), loadRoles()]);
  loadUsers();
}

async function loadRoles() {
  try {
    const res = await fetch('/api/users/roles', { credentials: 'same-origin' });
    roles = await res.json();
  } catch { roles = []; }
}

async function loadDepartments() {
  try {
    const res = await fetch('/api/users/departments', { credentials: 'same-origin' });
    departments = await res.json();
    populateDeptSelects();
    renderDepts();
  } catch {}
}

function populateDeptSelects() {
  ['uf-dept', 'df-parent'].forEach(id => {
    const sel = document.getElementById(id);
    const val = sel.value;
    sel.innerHTML = '<option value="">无</option>';
    departments.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.id; opt.textContent = d.name;
      sel.appendChild(opt);
    });
    sel.value = val;
  });
}

async function loadUsers() {
  try {
    const res = await fetch('/api/users', { credentials: 'same-origin' });
    const users = await res.json();
    const tbody = document.getElementById('users-body');
    if (!users.length) { tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8" style="color: var(--text-muted);">暂无用户</td></tr>'; return; }
    tbody.innerHTML = users.map(u => {
      const dept = departments.find(d => d.id === u.department_id);
      const isActive = u.is_active;
      return `<tr>
        <td class="font-medium" style="color: var(--text-primary);">${u.username}</td>
        <td style="color: var(--text-muted);">${u.email || '—'}</td>
        <td>${u.role || 'user'}</td>
        <td>${dept ? dept.name : '—'}</td>
        <td>${isActive ? '<span class="gf-tag gf-tag-green">启用</span>' : '<span class="gf-tag gf-tag-gray">禁用</span>'}</td>
        <td class="text-right">
          <button onclick="editUser('${u.id}')" class="text-xs mr-2" style="color: var(--accent-light); background: none; border: none; cursor: pointer;">编辑</button>
          <button onclick="deleteUser('${u.id}', '${u.username}')" class="text-xs" style="color: var(--danger); background: none; border: none; cursor: pointer;">删除</button>
        </td>
      </tr>`;
    }).join('');
  } catch {}
}

function renderDepts() {
  const tbody = document.getElementById('depts-body');
  if (!departments.length) { tbody.innerHTML = '<tr><td colspan="3" class="text-center py-8" style="color: var(--text-muted);">暂无部门</td></tr>'; return; }
  tbody.innerHTML = departments.map(d => {
    const parent = departments.find(p => p.id === d.parent_id);
    return `<tr>
      <td class="font-medium" style="color: var(--text-primary);">${d.name}</td>
      <td style="color: var(--text-muted);">${parent ? parent.name : '—'}</td>
      <td class="text-right">
        <button onclick="editDept('${d.id}')" class="text-xs mr-2" style="color: var(--accent-light); background: none; border: none; cursor: pointer;">编辑</button>
        <button onclick="deleteDept('${d.id}', '${d.name}')" class="text-xs" style="color: var(--danger); background: none; border: none; cursor: pointer;">删除</button>
      </td>
    </tr>`;
  }).join('');
}

// User CRUD
function showUserModal() {
  userEditingId = null;
  document.getElementById('user-modal-title').textContent = '创建用户';
  document.getElementById('uf-id').value = '';
  document.getElementById('uf-username').value = '';
  document.getElementById('uf-password').value = '';
  document.getElementById('uf-email').value = '';
  document.getElementById('uf-role').value = 'user';
  document.getElementById('uf-dept').value = '';
  document.getElementById('uf-active').checked = true;
  document.getElementById('uf-pw-hint').style.display = 'none';
  document.getElementById('user-modal').showModal();
}

async function editUser(id) {
  const res = await fetch('/api/users', { credentials: 'same-origin' });
  const users = await res.json();
  const u = users.find(u => u.id === id);
  if (!u) return;
  userEditingId = id;
  document.getElementById('user-modal-title').textContent = '编辑用户';
  document.getElementById('uf-id').value = id;
  document.getElementById('uf-username').value = u.username;
  document.getElementById('uf-password').value = '';
  document.getElementById('uf-email').value = u.email || '';
  document.getElementById('uf-role').value = u.role || 'user';
  document.getElementById('uf-dept').value = u.department_id || '';
  document.getElementById('uf-active').checked = u.is_active;
  document.getElementById('uf-pw-hint').style.display = 'inline';
  document.getElementById('user-modal').showModal();
}

document.getElementById('user-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formEl = document.getElementById('user-form');
  clearFormErrors(formEl);

  const body = {
    username: document.getElementById('uf-username').value,
    email: document.getElementById('uf-email').value || null,
    department_id: document.getElementById('uf-dept').value || null,
    is_active: document.getElementById('uf-active').checked,
  };
  const pw = document.getElementById('uf-password').value;
  if (pw) body.password = pw;

  try {
    const url = userEditingId ? `/api/users/${userEditingId}` : '/api/users';
    const method = userEditingId ? 'PUT' : 'POST';
    const res = await fetch(url, { method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      showFormErrors(formEl, d.detail);
      return;
    }
    document.getElementById('user-modal').close();
    showToast('已保存');
    loadAll();
  } catch (e) { showToast(e.message || '网络错误', 'error'); }
});

async function deleteUser(id, name) {
  if (!confirm(`确定删除用户 "${name}"？`)) return;
  try {
    const res = await fetch(`/api/users/${id}`, { method: 'DELETE', credentials: 'same-origin' });
    if (!res.ok) throw new Error('删除失败');
    showToast('已删除'); loadAll();
  } catch (e) { showToast(e.message, 'error'); }
}

// Dept CRUD
function showDeptModal() {
  deptEditingId = null;
  document.getElementById('dept-modal-title').textContent = '创建部门';
  document.getElementById('df-id').value = '';
  document.getElementById('df-name').value = '';
  document.getElementById('df-parent').value = '';
  document.getElementById('dept-modal').showModal();
}

function editDept(id) {
  const d = departments.find(d => d.id === id);
  if (!d) return;
  deptEditingId = id;
  document.getElementById('dept-modal-title').textContent = '编辑部门';
  document.getElementById('df-id').value = id;
  document.getElementById('df-name').value = d.name;
  document.getElementById('df-parent').value = d.parent_id || '';
  document.getElementById('dept-modal').showModal();
}

document.getElementById('dept-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formEl = document.getElementById('dept-form');
  clearFormErrors(formEl);

  const body = { name: document.getElementById('df-name').value, parent_id: document.getElementById('df-parent').value || null };
  try {
    const url = deptEditingId ? `/api/users/departments/${deptEditingId}` : '/api/users/departments';
    const method = deptEditingId ? 'PUT' : 'POST';
    const res = await fetch(url, { method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      showFormErrors(formEl, d.detail);
      return;
    }
    document.getElementById('dept-modal').close();
    showToast('已保存'); loadDepartments();
  } catch (e) { showToast(e.message || '网络错误', 'error'); }
});

async function deleteDept(id, name) {
  if (!confirm(`确定删除部门 "${name}"？`)) return;
  try {
    const res = await fetch(`/api/users/departments/${id}`, { method: 'DELETE', credentials: 'same-origin' });
    if (!res.ok) throw new Error('删除失败');
    showToast('已删除'); loadDepartments();
  } catch (e) { showToast(e.message, 'error'); }
}

loadAll();
</script>
{% endblock %}
